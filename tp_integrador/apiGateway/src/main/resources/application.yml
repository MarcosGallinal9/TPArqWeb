server:
port: 8080

spring:
application:
name: apiGateway

cloud:
  gateway:
    routes:
      # --- Ruta Administrador ---
      - id: administrador
        uri: http://localhost:8088
        predicates:
          - Path=/administrador/**

      # --- Ruta Cuenta ---
      - id: cuenta
        uri: http://localhost:8085
        predicates:
          - Path=/cuenta/**

      # --- Ruta Facturación ---
      - id: facturacion
        uri: http://localhost:8086
        predicates:
          - Path=/facturas/**

      # --- Ruta Monopatín ---
      - id: monopatin
        uri: http://localhost:8082
        predicates:
          - Path=/monopatines/**

      # --- Ruta Parada ---
      - id: parada
        uri: http://localhost:8083
        predicates:
          - Path=/paradas/**

      # --- Ruta Tarifa ---
      - id: tarifa
        uri: http://localhost:8087
        predicates:
          - Path=/tarifas/**

      # --- Ruta Usuario ---
      - id: usuario
        uri: http://localhost:8081
        predicates:
          - Path=/usuarios/**

      # --- Ruta Viaje ---
      - id: viaje
        uri: http://localhost:8084
        predicates:
          - Path=/viajes/**